        <script type="text/javascript">
        // Returns the source text
function get() { return document.getElementById('in').value; }
 
// Clears the source textbox
function clear() { document.getElementById('in').value = ''; }
 
// Writes to the output textbox
function set(v) { document.getElementById('out').innerHTML = v; }
 
// Holds the state information
var cache = {
    '_START': []
};
 
document.getElementById('add').onclick = function () {
    // Get the source text and split it into words
    

    var text = get().split(/\s+/g);

    
    if (!text.length)
        return;
 
    document.getElementById('generate').disabled = false;
 
    // Add it to the start node's list of possibility
    cache['_START'].push(text[0]);
    
    // Now go through each word and add it to the previous word's node
    for (var i = 0; i < text.length - 1; i++) {
        if (!cache[text[i]])
            cache[text[i]] = [];
        cache[text[i]].push(text[i + 1]);
        
        // If it's the beginning of a sentence, add the next word to the start node too
        if (text[i].match(/\.$/))
            cache['_START'].push(text[i + 1]);
    }
    clear();
};
 
document.getElementById('generate').onclick = function () {
    image();
    // Start with the root node
    var currentWord = '_START';
    var str = '';
    
    // Generate 300 words of text
    for (var i = 0; i < 10000; i++) {
        
        // Follow a random node, append it to the string, and move to that node
        var rand = Math.floor(Math.random() * cache[currentWord].length);
        str += cache[currentWord][rand];
        
        // No more nodes to follow? Start again. (Add a period to make things look better.)
        if (!cache[cache[currentWord][rand]]) {
            currentWord = '_START';
            if (!cache[currentWord][rand].match(/\.$/))
                str += '. ';
            else
                str += ' ';
        } else {
            currentWord = cache[currentWord][rand];
            str += ' ';
        }
    }

var res = str.match( /[^\.!\?]+[\.!\?]+/g);



    set(str);
document.getElementById('hi').innerHTML = res[3];


document.getElementById('cap').innerHTML = res[5];
document.getElementById('p1').innerHTML = res[0] + ' ' + res[1] + ' ' + res[2] + ' ' + res[3] + ' ' + res[4] ;
document.getElementById('p2').innerHTML = res[5] + ' ' + res[6] + ' ' + res[7] + ' ' + res[8];
document.getElementById('p3').innerHTML = res[9] + ' ' + res[10] + ' ' + res[11] + ' ' + res[12] + ' ' + res[13] + ' ' + res[14];
document.getElementById('p4').innerHTML = res[15] + ' ' + res[16] + ' ' + res[17] ;




}





function image (){
    var random = Math.floor(Math.random() * 39) + 1 ;

     

        $.getJSON( "https://api.flickr.com/services/rest/?method=flickr.photosets.getPhotos&api_key=fe76c865654cfba7361ca011b4096dd3&photoset_id=72157658833741705&format=json&nojsoncallback=1&extras=original_format,url_c,description,tags" , function(d) {
            

            for (var x = random; x < random + 1 ; x++) {
                var photo = d.photoset.photo[x];
                var bt_url = "http://farm"+ photo.farm +".static.flickr.com/"+ photo.server +"/"+ photo.id +"_"+ photo.secret +"_q.jpg";
                var c_url = "http://farm"+ photo.farm +".static.flickr.com/"+ photo.server +"/"+ photo.id +"_"+ photo.secret +"_c.jpg";
                var r =  c_url;
            };
                
            
            $('img').attr('src', r);
        });
}
